name: PhotoCleanup
options:
  bundleIdPrefix: com.riona.photocleanup
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  PhotoCleanupKit:
    path: PhotoCleanupKit

targets:
  PhotoCleanupApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PhotoCleanupApp
    dependencies:
      - package: PhotoCleanupKit
    info:
      path: PhotoCleanupApp/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.riona.photocleanup
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO

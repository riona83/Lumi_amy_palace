name: Build unsigned IPA

on:
  push:
    branches: [claude/iphone-photo-organizer-k72alq]
  workflow_dispatch: {}

jobs:
  test-kit:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run PhotoCleanupKit tests
        run: |
          cd PhotoCleanupKit
          swift test

  build:
    runs-on: macos-latest
    needs: test-kit
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build (unsigned, for iOS device)
        run: |
          xcodebuild build \
            -project PhotoCleanup.xcodeproj \
            -scheme PhotoCleanupApp \
            -configuration Debug \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Debug-iphoneos/PhotoCleanupApp.app" Payload/
          zip -r PhotoCleanupApp.ipa Payload

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoCleanupApp-unsigned-ipa
          path: PhotoCleanupApp.ipa
          retention-days: 14
